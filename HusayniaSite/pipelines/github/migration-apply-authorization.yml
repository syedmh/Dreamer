{
  "name": "T21 protected migration Apply authorization",
  "run-name": "T21 R10 M ${{ inputs.stage }} r${{ inputs.sourceReleaseRunId }} a${{ inputs.expectedAppSha256 }} p${{ inputs.preflightRunId }} i${{ inputs.stageOperationInputsRunId }} c${{ inputs.ctoAuthorizationRunId || 'none' }} approval=${{ inputs.ctoApprovalReference || 'none' }}",
  "on": {
    "workflow_dispatch": {
      "inputs": {
        "stage": {
          "description": "Immutable stage receiving the migration authorization",
          "required": true,
          "type": "choice",
          "options": ["Development", "Staging", "Production"]
        },
        "sourceReleaseRunId": {
          "description": "Completed-success approved release C6 run ID",
          "required": true,
          "type": "string"
        },
        "expectedAppSha256": {
          "description": "Expected immutable application SHA-256",
          "required": true,
          "type": "string"
        },
        "preflightRunId": {
          "description": "Completed-success trusted migration-preflight run ID",
          "required": true,
          "type": "string"
        },
        "stageOperationInputsRunId": {
          "description": "Completed-success prepared-input run ID",
          "required": true,
          "type": "string"
        },
        "authorizedCallerWorkflowRef": {
          "description": "Exact protected-main caller workflow ref from the stage caller matrix",
          "required": true,
          "type": "string"
        },
        "ctoAuthorizationRunId": {
          "description": "Production-only completed-success CTO authorization run ID",
          "required": false,
          "default": "",
          "type": "string"
        },
        "ctoApprovalReference": {
          "description": "Production-only approved CTO change/environment reference",
          "required": false,
          "default": "",
          "type": "string"
        },
        "expiresAtUtc": {
          "description": "Authorization expiry no more than four hours after issuance",
          "required": true,
          "type": "string"
        },
        "decision": {
          "description": "Explicit migration decision",
          "required": true,
          "type": "choice",
          "options": ["DENY", "AUTHORIZE"]
        }
      }
    }
  },
  "permissions": {
    "actions": "read",
    "attestations": "write",
    "contents": "read",
    "id-token": "write"
  },
  "jobs": {
    "authorize-apply": {
      "if": "${{ github.ref == 'refs/heads/main' && vars.T21_MIGRATION_AUTHORIZATION_ENABLED == 'true' && ((inputs.stage == 'Development' && vars.T21_DEVELOPMENT_DEPLOYMENT_ENABLED == 'true') || (inputs.stage == 'Staging' && vars.T21_STAGING_DEPLOYMENT_ENABLED == 'true') || (inputs.stage == 'Production' && vars.T21_PRODUCTION_DEPLOYMENT_ENABLED == 'true')) }}",
      "runs-on": "ubuntu-24.04",
      "environment": {
        "name": "Husaynia-${{ inputs.stage }}-Migration-Authorization"
      },
      "timeout-minutes": 25,
      "env": {
        "HUSAYNIA_REPOSITORY_ROOT": "${{ github.workspace }}/HusayniaSite"
      },
      "defaults": {
        "run": {
          "shell": "pwsh",
          "working-directory": "HusayniaSite"
        }
      },
      "steps": [
        {
          "name": "Checkout authorization scripts",
          "uses": "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683",
          "with": {
            "persist-credentials": false,
            "fetch-depth": 1
          }
        },
        {
          "name": "Validate canonical Husaynia checkout root",
          "run": "$workspace = (Resolve-Path -LiteralPath $env:GITHUB_WORKSPACE).Path; $root = (Resolve-Path -LiteralPath $env:HUSAYNIA_REPOSITORY_ROOT).Path; $expected = Join-Path $workspace 'HusayniaSite'; if ($root -cne $expected -or -not $root.StartsWith($workspace + [IO.Path]::DirectorySeparatorChar, [StringComparison]::Ordinal) -or -not (Test-Path -LiteralPath (Join-Path $root 'HusayniaSite.sln') -PathType Leaf) -or -not (Test-Path -LiteralPath (Join-Path $root 'eng') -PathType Container) -or -not (Test-Path -LiteralPath (Join-Path $root 'pipelines') -PathType Container)) { throw 'T21 canonical Dreamer/HusayniaSite checkout root validation failed.' }"
        },
        {
          "name": "Validate completed selectors caller matrix and protected stage",
          "env": {
            "T21_STAGE": "${{ inputs.stage }}",
            "T21_RELEASE_RUN_ID": "${{ inputs.sourceReleaseRunId }}",
            "T21_PREFLIGHT_RUN_ID": "${{ inputs.preflightRunId }}",
            "T21_PREPARED_INPUT_RUN_ID": "${{ inputs.stageOperationInputsRunId }}",
            "T21_EXPECTED_APP_SHA256": "${{ inputs.expectedAppSha256 }}",
            "T21_AUTHORIZED_CALLER_WORKFLOW_REF": "${{ inputs.authorizedCallerWorkflowRef }}",
            "T21_CTO_AUTHORIZATION_RUN_ID": "${{ inputs.ctoAuthorizationRunId }}",
            "T21_CTO_APPROVAL_REFERENCE": "${{ inputs.ctoApprovalReference }}",
            "T21_EXPECTED_BUNDLE_SHA256": "${{ vars.T21_TRUSTED_BUNDLE_SHA256 }}",
            "T21_STAGE_TARGET_METADATA_JSON": "${{ vars.T21_STAGE_TARGET_METADATA_JSON }}"
          },
          "run": ". (Join-Path $env:HUSAYNIA_REPOSITORY_ROOT 'eng/common/Release.Common.ps1'); $policyPath = Join-Path $env:HUSAYNIA_REPOSITORY_ROOT 'pipelines/config/promotion-policy.json'; $policy = Get-Content -LiteralPath $policyPath -Raw | ConvertFrom-Json; $null = Assert-StageDeploymentEnabled -Policy $policy -Stage $env:T21_STAGE -Operation 'Migration Apply authorization workflow'; $caller = @($policy.t21ProvenanceContract.callerMatrix | Where-Object { [string]$_.stage -ceq $env:T21_STAGE -and [string]$_.workflowRef -ceq $env:T21_AUTHORIZED_CALLER_WORKFLOW_REF }); $base = $caller.Count -eq 1 -and $env:T21_RELEASE_RUN_ID -match '^[1-9][0-9]*$' -and $env:T21_PREFLIGHT_RUN_ID -match '^[1-9][0-9]*$' -and $env:T21_PREPARED_INPUT_RUN_ID -match '^[1-9][0-9]*$' -and $env:T21_PREFLIGHT_RUN_ID -cne $env:T21_PREPARED_INPUT_RUN_ID -and $env:T21_EXPECTED_APP_SHA256 -match '^[a-f0-9]{64}$' -and $env:T21_EXPECTED_BUNDLE_SHA256 -match '^[a-f0-9]{64}$' -and -not [string]::IsNullOrWhiteSpace($env:T21_STAGE_TARGET_METADATA_JSON); $production = if ($env:T21_STAGE -ceq 'Production') { $env:T21_CTO_AUTHORIZATION_RUN_ID -match '^[1-9][0-9]*$' -and $env:T21_CTO_APPROVAL_REFERENCE -match '^[A-Za-z0-9][A-Za-z0-9._:/#-]{0,127}$' } else { [string]::IsNullOrWhiteSpace($env:T21_CTO_AUTHORIZATION_RUN_ID) -and [string]::IsNullOrWhiteSpace($env:T21_CTO_APPROVAL_REFERENCE) }; if (-not $base -or -not $production) { throw 'Migration authorization completed R/P/I/C selectors or caller binding is malformed.' }; [IO.File]::WriteAllText((Join-Path $env:RUNNER_TEMP 'stage-target.json'), $env:T21_STAGE_TARGET_METADATA_JSON, [Text.UTF8Encoding]::new($false))"
        },
        {
          "name": "Resolve completed release preflight and prepared-input provenance",
          "env": {
            "GITHUB_TOKEN": "${{ github.token }}",
            "T21_STAGE": "${{ inputs.stage }}",
            "T21_RELEASE_RUN_ID": "${{ inputs.sourceReleaseRunId }}",
            "T21_PREFLIGHT_RUN_ID": "${{ inputs.preflightRunId }}",
            "T21_PREPARED_INPUT_RUN_ID": "${{ inputs.stageOperationInputsRunId }}",
            "T21_EXPECTED_APP_SHA256": "${{ inputs.expectedAppSha256 }}",
            "T21_EXPECTED_BUNDLE_SHA256": "${{ vars.T21_TRUSTED_BUNDLE_SHA256 }}",
            "T21_AUTHORIZED_CALLER_WORKFLOW_REF": "${{ inputs.authorizedCallerWorkflowRef }}",
            "T21_TRUSTED_WORKFLOW_REF": "${{ vars.T21_TRUSTED_WORKFLOW_REF }}",
            "T21_STAGE_INPUTS_WORKFLOW_REF": "${{ vars.T21_STAGE_INPUTS_WORKFLOW_REF }}"
          },
          "run": "$policyPath = Join-Path $env:HUSAYNIA_REPOSITORY_ROOT 'pipelines/config/promotion-policy.json'; $resolver = Join-Path $env:HUSAYNIA_REPOSITORY_ROOT 'eng/promotion/Resolve-GitHubArtifactProvenance.ps1'; & $resolver -ExpectedRole release-c6 -RunId $env:T21_RELEASE_RUN_ID -ConsumerRunId $env:GITHUB_RUN_ID -Stage $env:T21_STAGE -ApplicationSha256 $env:T21_EXPECTED_APP_SHA256 -BundleSha256 $env:T21_EXPECTED_BUNDLE_SHA256 -OutputRoot (Join-Path $env:RUNNER_TEMP 'release') -PolicyPath $policyPath; if ($LASTEXITCODE -ne 0) { throw 'Migration authorization release provenance resolution failed.' }; $release = Get-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'release/verified-provenance.json') -Raw | ConvertFrom-Json -DateKind String; $releaseRoot = Join-Path (Join-Path $env:RUNNER_TEMP 'release/artifact') ([string]$release.artifact.name); $manifestPath = Join-Path $releaseRoot 'release/release-manifest.json'; $manifestSha = (Get-FileHash -LiteralPath $manifestPath -Algorithm SHA256).Hash.ToLowerInvariant(); & $resolver -ExpectedRole trusted-preflight -RunId $env:T21_PREFLIGHT_RUN_ID -ConsumerRunId $env:GITHUB_RUN_ID -Stage $env:T21_STAGE -ApplicationSha256 $env:T21_EXPECTED_APP_SHA256 -BundleSha256 $env:T21_EXPECTED_BUNDLE_SHA256 -ReleaseManifestSha256 $manifestSha -ReleaseCommitSha $release.run.commitSha -ExpectedTopLevelCallerWorkflowRef $env:T21_AUTHORIZED_CALLER_WORKFLOW_REF -ExpectedProducerWorkflowRef $env:T21_TRUSTED_WORKFLOW_REF -OutputRoot (Join-Path $env:RUNNER_TEMP 'preflight') -PolicyPath $policyPath; if ($LASTEXITCODE -ne 0) { throw 'Migration authorization preflight provenance resolution failed.' }; & $resolver -ExpectedRole stage-operation-inputs -RunId $env:T21_PREPARED_INPUT_RUN_ID -ConsumerRunId $env:GITHUB_RUN_ID -Stage $env:T21_STAGE -ApplicationSha256 $env:T21_EXPECTED_APP_SHA256 -BundleSha256 $env:T21_EXPECTED_BUNDLE_SHA256 -ReleaseManifestSha256 $manifestSha -ReleaseCommitSha $release.run.commitSha -ExpectedTopLevelCallerWorkflowRef $env:T21_AUTHORIZED_CALLER_WORKFLOW_REF -ExpectedProducerWorkflowRef $env:T21_STAGE_INPUTS_WORKFLOW_REF -OutputRoot (Join-Path $env:RUNNER_TEMP 'prepared-inputs') -PolicyPath $policyPath; if ($LASTEXITCODE -ne 0) { throw 'Migration authorization prepared-input provenance resolution failed.' }"
        },
        {
          "name": "Resolve and materialize completed Production CTO authorization",
          "if": "${{ inputs.stage == 'Production' }}",
          "env": {
            "GITHUB_TOKEN": "${{ github.token }}",
            "T21_CTO_AUTHORIZATION_RUN_ID": "${{ inputs.ctoAuthorizationRunId }}",
            "T21_EXPECTED_APP_SHA256": "${{ inputs.expectedAppSha256 }}",
            "T21_EXPECTED_BUNDLE_SHA256": "${{ vars.T21_TRUSTED_BUNDLE_SHA256 }}",
            "T21_CTO_APPROVAL_REFERENCE": "${{ inputs.ctoApprovalReference }}",
            "T21_AUTHORIZED_CALLER_WORKFLOW_REF": "${{ inputs.authorizedCallerWorkflowRef }}",
            "T21_TRUSTED_WORKFLOW_REF": "${{ vars.T21_TRUSTED_WORKFLOW_REF }}",
            "T21_STAGE_INPUTS_WORKFLOW_REF": "${{ vars.T21_STAGE_INPUTS_WORKFLOW_REF }}",
            "T21_CTO_AUTHORIZATION_WORKFLOW_REF": "${{ vars.T21_CTO_AUTHORIZATION_WORKFLOW_REF }}",
            "T21_CTO_AUTHORIZED_ACTOR_IDS": "${{ vars.T21_CTO_AUTHORIZED_ACTOR_IDS }}"
          },
          "run": "$policyPath = Join-Path $env:HUSAYNIA_REPOSITORY_ROOT 'pipelines/config/promotion-policy.json'; $resolver = Join-Path $env:HUSAYNIA_REPOSITORY_ROOT 'eng/promotion/Resolve-GitHubArtifactProvenance.ps1'; $release = Get-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'release/verified-provenance.json') -Raw | ConvertFrom-Json -DateKind String; $releaseRoot = Join-Path (Join-Path $env:RUNNER_TEMP 'release/artifact') ([string]$release.artifact.name); $manifestPath = Join-Path $releaseRoot 'release/release-manifest.json'; & $resolver -ExpectedRole cto-authorization -RunId $env:T21_CTO_AUTHORIZATION_RUN_ID -ConsumerRunId $env:GITHUB_RUN_ID -Stage Production -ApplicationSha256 $env:T21_EXPECTED_APP_SHA256 -BundleSha256 $env:T21_EXPECTED_BUNDLE_SHA256 -ReleaseManifestSha256 (Get-FileHash -LiteralPath $manifestPath -Algorithm SHA256).Hash.ToLowerInvariant() -ReleaseCommitSha $release.run.commitSha -ExpectedTopLevelCallerWorkflowRef 'syedmh/Dreamer/.github/workflows/cto-authorization-record.yml@refs/heads/main' -ExpectedProducerWorkflowRef $env:T21_CTO_AUTHORIZATION_WORKFLOW_REF -OutputRoot (Join-Path $env:RUNNER_TEMP 'cto') -PolicyPath $policyPath; if ($LASTEXITCODE -ne 0) { throw 'Migration authorization completed CTO provenance resolution failed.' }; & (Join-Path $env:HUSAYNIA_REPOSITORY_ROOT 'eng/promotion/Test-CtoAuthorizationRecord.ps1') -ExpectedAppSha256 $env:T21_EXPECTED_APP_SHA256 -ExpectedBundleSha256 $env:T21_EXPECTED_BUNDLE_SHA256 -ReleaseVerifiedProvenancePath (Join-Path $env:RUNNER_TEMP 'release/verified-provenance.json') -PreflightVerifiedProvenancePath (Join-Path $env:RUNNER_TEMP 'preflight/verified-provenance.json') -PreparedInputVerifiedProvenancePath (Join-Path $env:RUNNER_TEMP 'prepared-inputs/verified-provenance.json') -CtoAuthorizationVerifiedProvenancePath (Join-Path $env:RUNNER_TEMP 'cto/verified-provenance.json') -StageTargetMetadataPath (Join-Path $env:RUNNER_TEMP 'stage-target.json') -AuthorizedTopLevelCallerWorkflowRef $env:T21_AUTHORIZED_CALLER_WORKFLOW_REF -AuthorizedProducerWorkflowRef $env:T21_TRUSTED_WORKFLOW_REF -PreparedInputProducerWorkflowRef $env:T21_STAGE_INPUTS_WORKFLOW_REF -CtoAuthorizedActorIdAllowlist $env:T21_CTO_AUTHORIZED_ACTOR_IDS -ApprovalReference $env:T21_CTO_APPROVAL_REFERENCE -OutputPath (Join-Path $env:RUNNER_TEMP 'cto-context.json') -PolicyPath $policyPath; if ($LASTEXITCODE -ne 0) { throw 'Migration authorization Production CTO context materialization failed.' }"
        },
        {
          "name": "Create canonical migration authorization and producer manifest",
          "id": "canonical",
          "env": {
            "T21_STAGE": "${{ inputs.stage }}",
            "T21_EXPECTED_APP_SHA256": "${{ inputs.expectedAppSha256 }}",
            "T21_EXPECTED_BUNDLE_SHA256": "${{ vars.T21_TRUSTED_BUNDLE_SHA256 }}",
            "T21_AUTHORIZED_CALLER_WORKFLOW_REF": "${{ inputs.authorizedCallerWorkflowRef }}",
            "T21_TRUSTED_WORKFLOW_REF": "${{ vars.T21_TRUSTED_WORKFLOW_REF }}",
            "T21_STAGE_INPUTS_WORKFLOW_REF": "${{ vars.T21_STAGE_INPUTS_WORKFLOW_REF }}",
            "T21_CTO_AUTHORIZATION_WORKFLOW_REF": "${{ vars.T21_CTO_AUTHORIZATION_WORKFLOW_REF }}",
            "T21_DECISION": "${{ inputs.decision }}",
            "T21_EXPIRES_AT_UTC": "${{ inputs.expiresAtUtc }}",
            "T21_MIGRATION_AUTHORIZED_ACTOR_IDS": "${{ vars.T21_MIGRATION_AUTHORIZED_ACTOR_IDS }}",
            "T21_CTO_AUTHORIZATION_RUN_ID": "${{ inputs.ctoAuthorizationRunId }}",
            "T21_CTO_APPROVAL_REFERENCE": "${{ inputs.ctoApprovalReference }}"
          },
          "run": "$preflightPath = Join-Path $env:RUNNER_TEMP 'preflight/artifact/migration-preflight.json'; if (-not (Test-Path -LiteralPath $preflightPath -PathType Leaf)) { throw 'Resolved preflight evidence is missing before canonical authorization naming.' }; $preflightSha = (Get-FileHash -LiteralPath $preflightPath -Algorithm SHA256).Hash.ToLowerInvariant(); $artifactName = \"migration-apply-authorization-$env:T21_STAGE-$env:T21_EXPECTED_APP_SHA256-$preflightSha\"; $output = Join-Path $env:RUNNER_TEMP $artifactName; New-Item -ItemType Directory -Path $output -Force | Out-Null; $arguments = @{ Stage = $env:T21_STAGE; ExpectedAppSha256 = $env:T21_EXPECTED_APP_SHA256; ExpectedBundleSha256 = $env:T21_EXPECTED_BUNDLE_SHA256; ReleaseVerifiedProvenancePath = (Join-Path $env:RUNNER_TEMP 'release/verified-provenance.json'); StageTargetMetadataPath = (Join-Path $env:RUNNER_TEMP 'stage-target.json'); PreflightVerifiedProvenancePath = (Join-Path $env:RUNNER_TEMP 'preflight/verified-provenance.json'); PreparedInputVerifiedProvenancePath = (Join-Path $env:RUNNER_TEMP 'prepared-inputs/verified-provenance.json'); AuthorizedTopLevelCallerWorkflowRef = $env:T21_AUTHORIZED_CALLER_WORKFLOW_REF; AuthorizedProducerWorkflowRef = $env:T21_TRUSTED_WORKFLOW_REF; PreparedInputProducerWorkflowRef = $env:T21_STAGE_INPUTS_WORKFLOW_REF; Decision = $env:T21_DECISION; ExpiresAtUtc = $env:T21_EXPIRES_AT_UTC; AuthorizedByActor = $env:GITHUB_ACTOR; AuthorizedByActorId = $env:GITHUB_ACTOR_ID; AuthorizedActorIdAllowlist = $env:T21_MIGRATION_AUTHORIZED_ACTOR_IDS; OutputPath = (Join-Path $output 'migration-apply-authorization.json'); PolicyPath = (Join-Path $env:HUSAYNIA_REPOSITORY_ROOT 'pipelines/config/promotion-policy.json') }; if ($env:T21_STAGE -ceq 'Production') { $arguments.CtoAuthorizationRunId = $env:T21_CTO_AUTHORIZATION_RUN_ID; $arguments.CtoApprovalReference = $env:T21_CTO_APPROVAL_REFERENCE; $arguments.CtoAuthorizationVerifiedProvenancePath = (Join-Path $env:RUNNER_TEMP 'cto/verified-provenance.json'); $arguments.CtoAuthorizationContextPath = (Join-Path $env:RUNNER_TEMP 'cto-context.json'); $arguments.CtoAuthorizationProducerWorkflowRef = $env:T21_CTO_AUTHORIZATION_WORKFLOW_REF }; & (Join-Path $env:HUSAYNIA_REPOSITORY_ROOT 'eng/promotion/New-MigrationApplyAuthorization.ps1') @arguments; if ($LASTEXITCODE -ne 0) { throw 'Migration authorization v2.1 record creation failed.' }; $release = Get-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'release/verified-provenance.json') -Raw | ConvertFrom-Json -DateKind String; $releaseRoot = Join-Path (Join-Path $env:RUNNER_TEMP 'release/artifact') ([string]$release.artifact.name); $manifestPath = Join-Path $releaseRoot 'release/release-manifest.json'; & (Join-Path $env:HUSAYNIA_REPOSITORY_ROOT 'eng/promotion/New-T21ProducerManifest.ps1') -ArtifactRoot $output -ProducerRole migration-authorization -Stage $env:T21_STAGE -ApplicationSha256 $env:T21_EXPECTED_APP_SHA256 -BundleSha256 $env:T21_EXPECTED_BUNDLE_SHA256 -ReleaseManifestSha256 (Get-FileHash -LiteralPath $manifestPath -Algorithm SHA256).Hash.ToLowerInvariant() -ReleaseCommitSha $release.run.commitSha -ReleaseRunId $release.run.runId -ReleaseRunAttempt $release.run.runAttempt -ProducerRunId $env:GITHUB_RUN_ID -ProducerRunAttempt $env:GITHUB_RUN_ATTEMPT -ProducerCommitSha $env:GITHUB_SHA -TopLevelCallerWorkflowRef 'syedmh/Dreamer/.github/workflows/migration-apply-authorization.yml@refs/heads/main' -ProducerWorkflowRef \"syedmh/Dreamer/.github/workflows/migration-apply-authorization.yml@$env:GITHUB_SHA\" -PolicyPath (Join-Path $env:HUSAYNIA_REPOSITORY_ROOT 'pipelines/config/promotion-policy.json'); if ($LASTEXITCODE -ne 0) { throw 'Migration authorization producer manifest creation failed.' }; \"artifact-name=$artifactName\" | Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8; \"output-root=$output\" | Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8"
        },
        {
          "name": "Publish canonical protected migration authorization",
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "${{ steps.canonical.outputs.artifact-name }}",
            "path": "${{ steps.canonical.outputs.output-root }}",
            "if-no-files-found": "error",
            "overwrite": false,
            "retention-days": 30
          }
        },
        {
          "name": "Attest canonical migration authorization producer manifest",
          "uses": "actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be",
          "with": {
            "subject-path": "${{ steps.canonical.outputs.output-root }}/t21-producer-manifest.json"
          }
        }
      ]
    }
  }
}
