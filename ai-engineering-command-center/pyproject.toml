[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-engineering-command-center"
version = "0.1.0"
description = "Multi-agent AI platform for engineering automation"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.26.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.7.0",
    "chromadb>=0.5.0",
    "gitpython>=3.1.43",
]

[project.scripts]
ai-engineering = "cli.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["agents*", "core*", "services*", "cli*"]
