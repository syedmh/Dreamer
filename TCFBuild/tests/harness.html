<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>TCF Browser Harness</title>
  <style>
    body { font: 16px system-ui; margin: 2rem; }
    .pass { color: #078447; }
    .fail { color: #b42318; }
  </style>
</head>
<body>
  <h1>TCF browser smoke harness</h1>
  <ol id="results"></ol>
  <script type="module">
    import {
      deriveOperatorControlValues,
      deriveRaisedFromSliderValue,
      deriveSliderMaximum,
      MAX_GOAL,
      MIN_GOAL
    } from "../src/config.mjs";
    import { deriveProgress, revealSum } from "../src/model.mjs";
    import { createFundraiserView } from "../src/render.mjs";
    import { createScene } from "../src/scene.mjs";

    const results = document.querySelector("#results");
    async function busClearsOverlaysAcrossViewports() {
      const viewports = [
        [1920, 1080, "16:9"],
        [1366, 768, "wide"],
        [1024, 768, "4:3"],
        [768, 1024, "portrait"],
        [600, 1024, "narrow portrait"]
      ];
      const intersects = (first, second) =>
        first.left < second.right
        && first.right > second.left
        && first.top < second.bottom
        && first.bottom > second.top;
      let minimumClearance = Infinity;
      let minimumKeyboardClearance = Infinity;
      const keyboardClearances = {};

      for (const [width, height, label] of viewports) {
        const frame = document.createElement("iframe");
        frame.style.position = "fixed";
        frame.style.left = "-10000px";
        frame.style.top = "0";
        frame.style.width = `${width}px`;
        frame.style.height = `${height}px`;
        frame.style.border = "0";
        document.body.append(frame);

        try {
          const frameDocument = frame.contentDocument;
          frameDocument.open();
          frameDocument.write("<!doctype html><html><head></head><body></body></html>");
          frameDocument.close();
          const stylesheet = frameDocument.createElement("link");
          stylesheet.rel = "stylesheet";
          stylesheet.href = new URL("../styles.css", location.href).href;
          const stylesheetLoaded = new Promise((resolve, reject) => {
            stylesheet.addEventListener("load", resolve, { once: true });
            stylesheet.addEventListener("error", reject, { once: true });
          });
          frameDocument.head.append(stylesheet);

          const root = frameDocument.createElement("main");
          root.id = "fundraiser";
          root.dataset.motion = "reduce";
          root.innerHTML = `
            <section class="stage">
              <svg id="school-scene" viewBox="0 0 1600 900">
                <desc id="scene-description">School bus overlay probe.</desc>
              </svg>
              <header class="scoreboard">
                <div class="brand-card" aria-hidden="true">
                  <img class="brand-logo" src="../Logo.png" alt=""
                       width="430" height="332">
                </div>
                <div>
                  <p class="eyebrow">THE CITIZENS FOUNDATION</p>
                  <h1>Build a Brighter Future</h1>
                </div>
              </header>
              <section class="progress-card" aria-label="Fundraiser total">
                <p class="progress-label">Together we've raised</p>
                <p id="raised-display" class="raised-display"></p>
                <div class="meter"><span id="meter-fill" class="meter-fill"></span></div>
                <div class="progress-meta">
                  <span id="percent-display"></span>
                  <span id="goal-display"></span>
                </div>
                <p id="over-goal-message" class="over-goal-message">
                  The school is open — every extra gift welcomes more students!
                </p>
              </section>
              <p id="keyboard-hint" class="keyboard-hint">Press <kbd>Space</kbd> to hide key legends · <kbd>S</kbd> drop next school · <kbd>X</kbd> remove last school · <kbd>D</kbd> demo · <kbd>N</kbd> day/night · <kbd>O</kbd> clap · <kbd>P</kbd> thank you · <kbd>K</kbd> kite · <kbd>L</kbd> clear kites · <kbd>Q</kbd> firework · <kbd>W</kbd> continuous · <kbd>F</kbd> fullscreen · arrows/Home/End progress</p>
            </section>
          `;
          frameDocument.body.append(root);
          await stylesheetLoaded;
          const view = createFundraiserView(
            root,
            createScene({ maxStudents: 24 }),
            { locale: "en-US", currency: "USD" }
          );
          view.update({
            raised: 135000,
            goal: 100000,
            ...deriveProgress(135000, 100000),
            reducedMotion: true,
            celebrationActive: false
          });
          await new Promise((resolve, reject) => {
            const logo = frameDocument.querySelector(".brand-logo");
            if (logo.complete) {
              resolve();
            } else {
              logo.addEventListener("load", resolve, { once: true });
              logo.addEventListener("error", reject, { once: true });
            }
          });
          await new Promise((resolve) =>
            frame.contentWindow.requestAnimationFrame(() =>
              frame.contentWindow.requestAnimationFrame(resolve)
            )
          );

          const bus = frameDocument.querySelector(".school-bus");
          const message = frameDocument.querySelector(".over-goal-message");
          const overlays = [
            ["scoreboard", frameDocument.querySelector(".scoreboard")],
            ["progress-card", frameDocument.querySelector(".progress-card")],
            ["keyboard-hint", frameDocument.querySelector(".keyboard-hint")]
          ];
          if (!bus || !message || overlays.some(([, element]) => !element)) {
            throw new Error(`${label} display did not render required bus/overlay DOM`);
          }

          bus.setAttribute("transform", "translate(0 0)");
          bus.setAttribute("opacity", "1");
          for (const messageShown of [false, true]) {
            message.hidden = !messageShown;
            const busRect = bus.getBoundingClientRect();
            for (const [overlayName, overlay] of overlays) {
              const paintedElements = [
                overlay,
                ...overlay.querySelectorAll("*")
              ];
              for (const paintedElement of paintedElements) {
                const overlayRect = paintedElement.getBoundingClientRect();
                if (intersects(busRect, overlayRect)) {
                  throw new Error(JSON.stringify({
                    viewport: [width, height],
                    label,
                    messageShown,
                    overlay: overlayName,
                    paintedElement: paintedElement.tagName.toLowerCase(),
                    bus: {
                      left: busRect.left,
                      right: busRect.right,
                      top: busRect.top,
                      bottom: busRect.bottom
                    },
                    overlayBounds: {
                      left: overlayRect.left,
                      right: overlayRect.right,
                      top: overlayRect.top,
                      bottom: overlayRect.bottom
                    }
                  }));
                }
                minimumClearance = Math.min(
                  minimumClearance,
                  Math.max(
                    overlayRect.left - busRect.right,
                    busRect.left - overlayRect.right,
                    overlayRect.top - busRect.bottom,
                    busRect.top - overlayRect.bottom
                  )
                );
                const horizontallyAligned =
                  busRect.left < overlayRect.right
                  && busRect.right > overlayRect.left;
                if (overlayName === "keyboard-hint" && horizontallyAligned) {
                  const verticalClearance = overlayRect.top - busRect.bottom;
                  minimumKeyboardClearance = Math.min(
                    minimumKeyboardClearance,
                    verticalClearance
                  );
                  const key = `${width}x${height}`;
                  keyboardClearances[key] = Math.min(
                    keyboardClearances[key] ?? Infinity,
                    verticalClearance
                  );
                  if (verticalClearance < 12) {
                    throw new Error(JSON.stringify({
                      viewport: [width, height],
                      label,
                      messageShown,
                      overlay: overlayName,
                      paintedElement: paintedElement.tagName.toLowerCase(),
                      minimumRequired: 12,
                      verticalClearance,
                      busBottom: busRect.bottom,
                      overlayTop: overlayRect.top
                    }));
                  }
                }
              }
            }
          }
        } finally {
          frame.remove();
        }
      }

      document.body.dataset.busOverlayViewports = viewports
        .map(([width, height]) => `${width}x${height}`)
        .join(",");
      document.body.dataset.minimumBusOverlayClearance =
        minimumClearance.toFixed(3);
      document.body.dataset.minimumBusKeyboardClearance =
        minimumKeyboardClearance.toFixed(3);
      document.body.dataset.busKeyboardClearances =
        JSON.stringify(keyboardClearances);
      return minimumClearance > 0
        && minimumKeyboardClearance >= 12;
    }

    async function createCampusProbe({ loadStylesheet = true } = {}) {
      const host = document.createElement("div");
      host.style.position = "fixed";
      host.style.left = "-10000px";
      host.style.top = "0";
      const shadow = host.attachShadow({ mode: "open" });
      let stylesheet;
      let stylesheetLoaded;
      if (loadStylesheet) {
        stylesheet = document.createElement("link");
        stylesheet.rel = "stylesheet";
        stylesheet.href = "../styles.css";
        stylesheetLoaded = new Promise((resolve, reject) => {
          stylesheet.addEventListener("load", resolve, { once: true });
          stylesheet.addEventListener("error", () => {
            reject(new Error("campus probe stylesheet failed to load"));
          }, { once: true });
        });
      }
      const root = document.createElement("main");
      root.id = "fundraiser";
      root.dataset.motion = "full";
      root.innerHTML = `
        <section class="stage">
          <span id="raised-display"></span>
          <span id="goal-display"></span>
          <span id="percent-display"></span>
          <span id="meter-fill"></span>
          <span id="over-goal-message"></span>
          <svg id="school-scene" xmlns="http://www.w3.org/2000/svg"
               viewBox="0 0 1600 900" width="100%" height="100%"></svg>
        </section>
      `;
      if (loadStylesheet) {
        shadow.append(stylesheet, root);
      } else {
        const width = Math.min(innerWidth, innerHeight * 16 / 9);
        const height = Math.min(innerHeight, innerWidth * 9 / 16);
        host.style.width = `${width}px`;
        host.style.height = `${height}px`;
        root.style.width = `${width}px`;
        root.style.height = `${height}px`;
        const stage = root.querySelector(".stage");
        stage.style.width = `${width}px`;
        stage.style.height = `${height}px`;
        stage.querySelector("#raised-display").textContent =
          "painted mask origin probe";
        stage.querySelector("#school-scene").style.display = "block";
        shadow.append(root);
      }
      document.body.append(host);
      if (loadStylesheet) await stylesheetLoaded;
      const scene = createScene({ maxStudents: 24 });
      const view = createFundraiserView(
        root,
        scene,
        { locale: "en-US", currency: "USD" }
      );
      return {
        root,
        scene,
        view,
        remove() {
          host.remove();
        }
      };
    }

    const paintedStudentMilestones = Object.freeze([
      103,
      110,
      111.482,
      113.5,
      121,
      124.0372,
      124.5,
      125,
      130,
      135
    ]);

    const paintedMaskSupersample = 2;
    const animatedStudentTargetPercents = Object.freeze([
      ...[24, 28, 32, 35].flatMap((studentIndex) =>
        [.68048, .69344, .7064].map((reveal) =>
          100 + (studentIndex + reveal) / 36 * 25
        )
      ),
      125,
      130,
      135
    ]);

    async function measurePaintedStudentAndBusIntersections() {
      const probe = await createCampusProbe({ loadStylesheet: false });
      const loadImage = (source) => new Promise((resolve, reject) => {
        const image = new Image();
        image.addEventListener("load", () => resolve(image), { once: true });
        image.addEventListener("error", () => {
          reject(new Error("isolated SVG raster failed to load"));
        }, { once: true });
        image.src = `data:image/svg+xml;charset=utf-8,${
          encodeURIComponent(source)
        }`;
      });

      try {
        const stage = probe.root.querySelector(".stage");
        const svgViewport = probe.root.querySelector("#school-scene");
        const students = [...probe.root.querySelectorAll(".student")];
        const bus = probe.root.querySelector(".school-bus");
        const trees = [...probe.root.querySelectorAll(".tree")];
        const obstacles = [
          ...trees.map((tree, index) => [`tree-${index}`, tree]),
          ["playground", probe.root.querySelector(".swings")],
          ["teacher", probe.root.querySelector(".teacher")],
          ["school", probe.root.querySelector(".school")]
        ];
        if (
          !svgViewport
          || trees.length !== 3
          || obstacles.some(([, element]) => !element)
        ) {
          throw new Error("painted bus obstacle probe did not render");
        }
        const stageBounds = stage.getBoundingClientRect();
        const svgBounds = svgViewport.getBoundingClientRect();
        const svgRasterWidth = Math.round(svgBounds.width);
        const svgRasterHeight = Math.round(svgBounds.height);
        const supersampledSvgWidth =
          svgRasterWidth * paintedMaskSupersample;
        const supersampledSvgHeight =
          svgRasterHeight * paintedMaskSupersample;
        const svgScaleX = supersampledSvgWidth / 1600;
        const svgScaleY = supersampledSvgHeight / 900;
        const trunkHeights = trees.map((tree) =>
          Number(tree.querySelector("rect")?.getAttribute("height"))
        );
        const prominentTrunkBottom =
          probe.scene.campus.trees[0].y
          + (12 + trunkHeights[0]) * probe.scene.campus.trees[0].scale;
        const treeGeometryValid = prominentTrunkBottom === 616.8
          && trunkHeights[0] === 76
          && trunkHeights.slice(1).every((height) => height === 98);
        const canvas = document.createElement("canvas");
        const context = canvas.getContext("2d", { willReadFrequently: true });
        const rasterCache = new WeakMap();

        const rasterize = async (element) => {
          const signature = [
            element.getAttribute("opacity"),
            element.getAttribute("transform")
          ].join("|");
          const cached = rasterCache.get(element);
          if (cached?.signature === signature) return cached.raster;

          const bounds = element.getBoundingClientRect();
          const padding = 2 * paintedMaskSupersample;
          const left = Math.max(
            0,
            Math.floor(
              (bounds.left - svgBounds.left) * paintedMaskSupersample
            ) - padding
          );
          const top = Math.max(
            0,
            Math.floor(
              (bounds.top - svgBounds.top) * paintedMaskSupersample
            ) - padding
          );
          const right = Math.min(
            supersampledSvgWidth,
            Math.ceil(
              (bounds.right - svgBounds.left) * paintedMaskSupersample
            ) + padding
          );
          const bottom = Math.min(
            supersampledSvgHeight,
            Math.ceil(
              (bounds.bottom - svgBounds.top) * paintedMaskSupersample
            ) + padding
          );
          const rasterWidth = Math.max(0, right - left);
          const rasterHeight = Math.max(0, bottom - top);
          if (rasterWidth === 0 || rasterHeight === 0) {
            return { left, top, width: 0, height: 0, alpha: new Uint8Array() };
          }

          const source = [
            `<svg xmlns="http://www.w3.org/2000/svg"`,
            ` width="${rasterWidth}" height="${rasterHeight}"`,
            ` viewBox="${left / svgScaleX} ${top / svgScaleY}`,
            ` ${rasterWidth / svgScaleX} ${rasterHeight / svgScaleY}">`,
            new XMLSerializer().serializeToString(element),
            "</svg>"
          ].join("");
          const image = await loadImage(source);
          canvas.width = rasterWidth;
          canvas.height = rasterHeight;
          context.clearRect(0, 0, rasterWidth, rasterHeight);
          context.drawImage(image, 0, 0, rasterWidth, rasterHeight);
          const rgba = context.getImageData(
            0,
            0,
            rasterWidth,
            rasterHeight
          ).data;
          const alpha = new Uint8Array(rasterWidth * rasterHeight);
          for (let pixel = 0; pixel < alpha.length; pixel += 1) {
            alpha[pixel] = rgba[pixel * 4 + 3] > 0 ? 1 : 0;
          }
          const raster = {
            left,
            top,
            width: rasterWidth,
            height: rasterHeight,
            alpha
          };
          rasterCache.set(element, { signature, raster });
          return raster;
        };

        const cropOriginFor = (bounds, originBounds) => {
          const padding = 2 * paintedMaskSupersample;
          return {
            left: Math.max(
              0,
              Math.floor(
                (bounds.left - originBounds.left) * paintedMaskSupersample
              ) - padding
            ),
            top: Math.max(
              0,
              Math.floor(
                (bounds.top - originBounds.top) * paintedMaskSupersample
              ) - padding
            )
          };
        };
        const prominentTreeBounds = trees[0].getBoundingClientRect();
        const svgOriginCrop = cropOriginFor(prominentTreeBounds, svgBounds);
        const stageOriginCrop = cropOriginFor(
          prominentTreeBounds,
          stageBounds
        );
        const prominentTreeRaster = await rasterize(trees[0]);
        const svgStageOffset = {
          left: svgBounds.left - stageBounds.left,
          top: svgBounds.top - stageBounds.top
        };
        const rasterOriginUsesSvgBounds =
          svgBounds.top !== stageBounds.top
          && prominentTreeRaster.left === svgOriginCrop.left
          && prominentTreeRaster.top === svgOriginCrop.top
          && (
            prominentTreeRaster.left !== stageOriginCrop.left
            || prominentTreeRaster.top !== stageOriginCrop.top
          );

        const countPaintedIntersections = (first, second) => {
          const left = Math.max(first.left, second.left);
          const top = Math.max(first.top, second.top);
          const right = Math.min(
            first.left + first.width,
            second.left + second.width
          );
          const bottom = Math.min(
            first.top + first.height,
            second.top + second.height
          );
          if (left >= right || top >= bottom) return 0;

          let intersections = 0;
          for (let y = top; y < bottom; y += 1) {
            const firstRow = (y - first.top) * first.width;
            const secondRow = (y - second.top) * second.width;
            for (let x = left; x < right; x += 1) {
              if (
                first.alpha[firstRow + x - first.left] > 0
                && second.alpha[secondRow + x - second.left] > 0
              ) {
                intersections += 1;
              }
            }
          }
          return intersections;
        };

        let scannedStaticStates = 0;
        let scannedAnimatedFrames = 0;
        let studentIntersections = 0;
        let busIntersections = 0;
        const obstacleIntersections = Object.fromEntries(
          obstacles.map(([name]) => [name, 0])
        );
        let treeIntersectionsAt130 = 0;
        let treeStatesAt130 = 0;
        let teacherPlacementValid = true;
        let teacherPlacementStates = 0;
        let stageEdgeViolations = 0;
        const maximumScannedPercent = { full: 0, reduced: 0 };
        const scannedBusStates = { full: 0, reduced: 0 };
        let firstStudentIntersection = null;
        let firstBusIntersection = null;

        const paintedDiagnostic = (details) => ({
          viewport: [innerWidth, innerHeight],
          stageRect: {
            left: stageBounds.left,
            top: stageBounds.top,
            width: stageBounds.width,
            height: stageBounds.height
          },
          svgRect: {
            left: svgBounds.left,
            top: svgBounds.top,
            width: svgBounds.width,
            height: svgBounds.height
          },
          supersampledSvg: [
            supersampledSvgWidth,
            supersampledSvgHeight
          ],
          supersample: paintedMaskSupersample,
          ...details
        });

        const failPaintedState = (details) => {
          const diagnostic = JSON.stringify(paintedDiagnostic(details));
          document.body.dataset.paintedMaskFailure = diagnostic;
          throw new Error(diagnostic);
        };

        const recordPaintedIntersection = (kind, details) => {
          const diagnostic = paintedDiagnostic(details);
          const serialized = JSON.stringify(diagnostic);
          if (kind === "student" && firstStudentIntersection === null) {
            firstStudentIntersection = diagnostic;
            document.body.dataset.paintedStudentMaskFailure = serialized;
          }
          if (kind === "bus" && firstBusIntersection === null) {
            firstBusIntersection = diagnostic;
            document.body.dataset.paintedBusMaskFailure = serialized;
          }
          if (!document.body.dataset.paintedMaskFailure) {
            document.body.dataset.paintedMaskFailure = serialized;
          }
        };

        const scanPaintedState = async ({
          percent,
          motion,
          direction,
          phase,
          frame
        }) => {
          document.body.dataset.paintedMaskLastTarget = percent.toFixed(6);
          document.body.dataset.paintedMaskLastDirection = direction;
          document.body.dataset.paintedMaskLastFrame = String(frame);
          maximumScannedPercent[motion] = Math.max(
            maximumScannedPercent[motion],
            percent
          );
          if (phase === "static" && percent === 125) {
            teacherPlacementStates += 1;
            teacherPlacementValid &&=
              obstacles.find(([name]) => name === "teacher")[1]
                .getAttribute("transform")
                === "translate(550 698) scale(1.08)";
          }

          const visibleStudents = students
            .map((student, index) => ({ student, index }))
            .filter(({ student }) =>
              Number(student.getAttribute("opacity")) > 0
            );
          const studentRasters = await Promise.all(
            visibleStudents.map(async ({ student, index }) => ({
              index,
              raster: await rasterize(student)
            }))
          );

          for (let first = 0; first < studentRasters.length; first += 1) {
            for (
              let second = first + 1;
              second < studentRasters.length;
              second += 1
            ) {
              const intersections = countPaintedIntersections(
                studentRasters[first].raster,
                studentRasters[second].raster
              );
              studentIntersections += intersections;
              if (intersections > 0) {
                recordPaintedIntersection("student", {
                  percent,
                  motion,
                  direction,
                  phase,
                  frame,
                  pair: [
                    studentRasters[first].index,
                    studentRasters[second].index
                  ],
                  studentIntersections: intersections,
                  busIntersections: 0
                });
              }
            }
          }

          if (Number(bus.getAttribute("opacity")) > 0) {
            scannedBusStates[motion] += 1;
            const busRaster = await rasterize(bus);
            for (const { index, raster } of studentRasters) {
              const intersections = countPaintedIntersections(
                busRaster,
                raster
              );
              busIntersections += intersections;
              if (intersections > 0) {
                recordPaintedIntersection("bus", {
                  percent,
                  motion,
                  direction,
                  phase,
                  frame,
                  student: index,
                  studentIntersections: 0,
                  busIntersections: intersections
                });
              }
            }
            for (const [name, element] of obstacles) {
              const intersections = countPaintedIntersections(
                busRaster,
                await rasterize(element)
              );
              obstacleIntersections[name] += intersections;
              if (name.startsWith("tree-") && percent === 130) {
                treeStatesAt130 += 1;
                treeIntersectionsAt130 += intersections;
              }
              if (intersections > 0) {
                recordPaintedIntersection("bus", {
                  percent,
                  motion,
                  direction,
                  phase,
                  frame,
                  obstacle: name,
                  studentIntersections: 0,
                  busIntersections: intersections
                });
              }
            }
            const busBounds = bus.getBoundingClientRect();
            if (
              busBounds.top < stageBounds.top
              || busBounds.right > stageBounds.right
              || busBounds.bottom > stageBounds.bottom
            ) {
              stageEdgeViolations += 1;
            }
          }
        };

        delete document.body.dataset.paintedMaskFailure;
        delete document.body.dataset.paintedStudentMaskFailure;
        delete document.body.dataset.paintedBusMaskFailure;
        for (const reducedMotion of [false, true]) {
          probe.root.dataset.motion = reducedMotion ? "reduce" : "full";
          for (const direction of ["ascending", "reverse"]) {
            const milestones = direction === "ascending"
              ? paintedStudentMilestones
              : [...paintedStudentMilestones].reverse();
            for (const percent of milestones) {
              const ratio = percent / 100;
              probe.view.update({
                raised: ratio * 100000,
                goal: 100000,
                ...deriveProgress(ratio * 100000, 100000),
                reducedMotion,
                celebrationActive: false
              });

              await scanPaintedState({
                percent,
                motion: reducedMotion ? "reduced" : "full",
                direction,
                phase: "static",
                frame: 0
              });
              scannedStaticStates += 1;
            }
          }
        }

        const animatedBaselinePercent = 100 + 24 / 36 * 25;
        const updateAnimatedTarget = (percent, reducedMotion, deltaMs) => {
          const ratio = percent / 100;
          return probe.view.update({
            raised: ratio * 100000,
            goal: 100000,
            ...deriveProgress(ratio * 100000, 100000),
            deltaMs,
            reducedMotion,
            celebrationActive: false
          });
        };

        probe.root.dataset.motion = "reduce";
        updateAnimatedTarget(animatedBaselinePercent, true, 0);
        probe.root.dataset.motion = "full";
        for (const [direction, targets] of [
          ["forward", animatedStudentTargetPercents],
          [
            "reverse",
            [
              ...animatedStudentTargetPercents.slice(0, -1).reverse(),
              animatedBaselinePercent
            ]
          ]
        ]) {
          for (const percent of targets) {
            let result;
            let frame = 0;
            do {
              result = updateAnimatedTarget(percent, false, 16);
              frame += 1;
              scannedAnimatedFrames += 1;
              await scanPaintedState({
                percent,
                motion: "full",
                direction,
                phase: "animated",
                frame
              });
              if (frame >= 2000) {
                failPaintedState({
                  percent,
                  motion: "full",
                  direction,
                  phase: "animated",
                  frame,
                  reason: "renderer did not settle"
                });
              }
            } while (result.needsFrame);
          }
        }

        document.body.dataset.paintedMaskSupersample = String(
          paintedMaskSupersample
        );
        document.body.dataset.paintedMaskRasterSize =
          `${supersampledSvgWidth}x${supersampledSvgHeight}`;
        document.body.dataset.paintedMaskSvgStageOffset =
          JSON.stringify(svgStageOffset);
        document.body.dataset.paintedMaskSvgOriginCrop =
          JSON.stringify(svgOriginCrop);
        document.body.dataset.paintedMaskStageOriginCrop =
          JSON.stringify(stageOriginCrop);
        document.body.dataset.paintedMaskUsesSvgOrigin =
          String(rasterOriginUsesSvgBounds);
        document.body.dataset.prominentTreeTrunkBottom =
          prominentTrunkBottom.toFixed(1);
        document.body.dataset.treeTrunkHeights =
          trunkHeights.join(",");
        document.body.dataset.treeGeometryValid =
          String(treeGeometryValid);
        document.body.dataset.teacherTransform =
          "translate(550 698) scale(1.08)";
        document.body.dataset.teacherPlacementValid =
          String(teacherPlacementValid && teacherPlacementStates === 4);
        document.body.dataset.teacherPlacementStates =
          String(teacherPlacementStates);
        document.body.dataset.paintedMaskStaticStates = String(
          scannedStaticStates
        );
        document.body.dataset.paintedMaskAnimatedFrames = String(
          scannedAnimatedFrames
        );
        document.body.dataset.paintedMaskAnimatedTargets =
          animatedStudentTargetPercents
            .map((percent) => percent.toFixed(6))
            .join(",");
        document.body.dataset.paintedMaskStates = String(
          scannedStaticStates + scannedAnimatedFrames
        );
        document.body.dataset.paintedStudentIntersections = String(
          studentIntersections
        );
        document.body.dataset.paintedBusStudentIntersections = String(
          busIntersections
        );
        document.body.dataset.paintedBusObstacleIntersections =
          JSON.stringify(obstacleIntersections);
        document.body.dataset.paintedBusTreeIntersectionsAt130 =
          String(treeIntersectionsAt130);
        document.body.dataset.paintedBusTreeStatesAt130 =
          String(treeStatesAt130);
        document.body.dataset.paintedBusStageEdgeViolations = String(
          stageEdgeViolations
        );
        document.body.dataset.paintedBusFullMaxPercent =
          maximumScannedPercent.full.toFixed(3);
        document.body.dataset.paintedBusReducedMaxPercent =
          maximumScannedPercent.reduced.toFixed(3);
        document.body.dataset.paintedBusFullStates = String(
          scannedBusStates.full
        );
        document.body.dataset.paintedBusReducedStates = String(
          scannedBusStates.reduced
        );
        return {
          scanComplete: paintedMaskSupersample > 1
            && scannedStaticStates === 40
            && scannedAnimatedFrames
              > animatedStudentTargetPercents.length * 2,
          busPhaseComplete: maximumScannedPercent.full === 135
            && maximumScannedPercent.reduced === 135
            && scannedBusStates.full > 0
            && scannedBusStates.reduced > 0,
          studentIntersections,
          busIntersections,
          obstacleIntersections,
          treeIntersectionsAt130,
          treeStatesAt130,
          stageEdgeViolations,
          rasterOriginUsesSvgBounds,
          treeGeometryValid,
          teacherPlacementValid:
            teacherPlacementValid && teacherPlacementStates === 4,
          firstStudentIntersection,
          firstBusIntersection
        };
      } finally {
        probe.remove();
      }
    }

    let paintedIntersectionMeasurement;
    const getPaintedIntersectionMeasurement = () => {
      paintedIntersectionMeasurement ??=
        measurePaintedStudentAndBusIntersections();
      return paintedIntersectionMeasurement;
    };

    async function paintedStudentMasksNeverIntersect() {
      const measurement = await getPaintedIntersectionMeasurement();
      return measurement.scanComplete
        && measurement.studentIntersections === 0;
    }

    async function paintedBusNeverIntersectsStudentsThroughBusPhase() {
      const measurement = await getPaintedIntersectionMeasurement();
      return measurement.scanComplete
        && measurement.busPhaseComplete
        && measurement.busIntersections === 0;
    }

    async function paintedBusClearsCampusObstaclesAndStageEdges() {
      const measurement = await getPaintedIntersectionMeasurement();
      return measurement.scanComplete
        && measurement.teacherPlacementValid
        && Object.values(measurement.obstacleIntersections)
          .every((count) => count === 0)
        && measurement.treeStatesAt130 > 0
        && measurement.treeIntersectionsAt130 === 0
        && measurement.stageEdgeViolations === 0;
    }

    async function prominentTreeTrunkGeometryIsScoped() {
      const measurement = await getPaintedIntersectionMeasurement();
      return measurement.treeGeometryValid;
    }

    async function paintedMasksUseSvgViewportOrigin() {
      const measurement = await getPaintedIntersectionMeasurement();
      return measurement.rasterOriginUsesSvgBounds;
    }

    async function measureStudentRoutesAcrossFullRamp() {
      const probe = await createCampusProbe();
      const intersects = (first, second) =>
        first.left < second.right
        && first.right > second.left
        && first.top < second.bottom
        && first.bottom > second.top;
      const overlapArea = (first, second) =>
        Math.max(
          0,
          Math.min(first.right, second.right) - Math.max(first.left, second.left)
        )
        * Math.max(
          0,
          Math.min(first.bottom, second.bottom) - Math.max(first.top, second.top)
        );
      try {
        const bus = probe.root.querySelector(".school-bus");
        const students = [...probe.root.querySelectorAll(".student")];
        const stage = probe.root.querySelector(".stage");
        const measurements = {};
        for (const reducedMotion of [false, true]) {
          const forwardSignatures = new Map();
          let maximumOverlapArea = 0;
          let overlapViolations = 0;
          let busIntersections = 0;
          probe.root.dataset.motion = reducedMotion ? "reduce" : "full";
          for (const direction of ["ascending", "descending"]) {
            for (let sample = 0; sample <= 1400; sample += 1) {
              const step = direction === "ascending" ? sample : 1400 - sample;
              const ratio = 1 + .00025 * step;
              probe.view.update({
                raised: ratio * 100000,
                goal: 100000,
                ...deriveProgress(ratio * 100000, 100000),
                reducedMotion,
                celebrationActive: false
              });

              const stageBounds = stage.getBoundingClientRect();
              const scaleX = stageBounds.width / 1600;
              const scaleY = stageBounds.height / 900;
              const visibleStudents = students
                .filter((student) => Number(student.getAttribute("opacity")) > 0)
                .map((student) => ({
                  student,
                  bounds: student.getBoundingClientRect()
                }));
              for (let first = 0; first < visibleStudents.length; first += 1) {
                for (
                  let second = first + 1;
                  second < visibleStudents.length;
                  second += 1
                ) {
                  const screenArea = overlapArea(
                    visibleStudents[first].bounds,
                    visibleStudents[second].bounds
                  );
                  const sceneArea = screenArea / (scaleX * scaleY);
                  maximumOverlapArea = Math.max(maximumOverlapArea, sceneArea);
                  if (sceneArea >= 850) overlapViolations += 1;
                }
              }

              if (Number(bus.getAttribute("opacity")) > 0) {
                const busBounds = bus.getBoundingClientRect();
                for (const { bounds } of visibleStudents) {
                  if (intersects(busBounds, bounds)) busIntersections += 1;
                }
              }

              const signature = JSON.stringify([
                ...students.map((student) => [
                  student.getAttribute("opacity"),
                  student.getAttribute("transform")
                ]),
                bus.getAttribute("transform")
              ]);
              const key = `${reducedMotion}:${step}`;
              if (direction === "ascending") {
                forwardSignatures.set(key, signature);
              } else if (signature !== forwardSignatures.get(key)) {
                throw new Error(`reverse route mismatch at ${ratio}`);
              }
            }
          }
          measurements[reducedMotion ? "reduced" : "full"] = {
            maximumOverlapArea,
            overlapViolations,
            busIntersections
          };
        }

        probe.view.update({
          raised: 135000,
          goal: 100000,
          ...deriveProgress(135000, 100000),
          reducedMotion: true,
          celebrationActive: false
        });
        const placements = new Set(students.map(
          (student) => student.getAttribute("transform")
        ));
        document.body.dataset.fullMotionMaximumStudentOverlap =
          measurements.full.maximumOverlapArea.toFixed(3);
        document.body.dataset.reducedMotionMaximumStudentOverlap =
          measurements.reduced.maximumOverlapArea.toFixed(3);
        document.body.dataset.fullMotionStudentOverlapViolations = String(
          measurements.full.overlapViolations
        );
        document.body.dataset.reducedMotionStudentOverlapViolations = String(
          measurements.reduced.overlapViolations
        );
        document.body.dataset.fullMotionBusStudentIntersections = String(
          measurements.full.busIntersections
        );
        document.body.dataset.reducedMotionBusStudentIntersections = String(
          measurements.reduced.busIntersections
        );
        document.body.dataset.distinctStudentPlacements = String(placements.size);
        return {
          measurements,
          distinctStudentPlacements: placements.size
        };
      } finally {
        probe.remove();
      }
    }

    let studentRouteMeasurement;
    const getStudentRouteMeasurement = () => {
      studentRouteMeasurement ??= measureStudentRoutesAcrossFullRamp();
      return studentRouteMeasurement;
    };

    async function studentRoutesClearAcrossFullRamp() {
      const { measurements, distinctStudentPlacements } =
        await getStudentRouteMeasurement();
      return measurements.full.maximumOverlapArea < 850
        && measurements.reduced.maximumOverlapArea < 850
        && measurements.full.overlapViolations === 0
        && measurements.reduced.overlapViolations === 0
        && distinctStudentPlacements === 36;
    }

    async function busBoundsClearStudentsAcrossFullRamp() {
      const { measurements } = await getStudentRouteMeasurement();
      return measurements.full.busIntersections === 0
        && measurements.reduced.busIntersections === 0;
    }

    async function flagGeometryAndWaveArePoleAnchored() {
      const probe = await createCampusProbe();
      const distance = (first, second) => Math.hypot(
        first.x - second.x,
        first.y - second.y
      );
      const screenPoint = (element, x, y) => {
        const matrix = element.getScreenCTM();
        return new DOMPoint(x, y).matrixTransform(matrix);
      };

      try {
        probe.view.update({
          raised: 100000,
          goal: 100000,
          ...deriveProgress(100000, 100000),
          reducedMotion: false,
          celebrationActive: false
        });
        const cloth = probe.root.querySelector(".flag-cloth");
        const greenField = cloth.querySelector("rect");
        const circles = [...cloth.querySelectorAll("circle")];
        const star = cloth.querySelector("polygon");
        const computedOrigin = getComputedStyle(cloth).transformOrigin;
        if (
          cloth.dataset.width !== "132"
          || cloth.dataset.height !== "88"
          || cloth.dataset.hoistSide !== "left"
          || cloth.dataset.flyDirection !== "right"
          || greenField.getAttribute("x") !== "33"
          || greenField.getAttribute("width") !== "99"
          || greenField.getAttribute("height") !== "88"
          || computedOrigin !== "0px 44px"
          || Number(circles[1].getAttribute("cx"))
            <= Number(circles[0].getAttribute("cx"))
          || Number(star.getAttribute("points").split(",")[0]) <= 33
        ) {
          throw new Error(JSON.stringify({
            width: cloth.dataset.width,
            height: cloth.dataset.height,
            stripe: [
              greenField.getAttribute("x"),
              greenField.getAttribute("width")
            ],
            computedOrigin
          }));
        }

        const animation = cloth.getAnimations()[0];
        if (!animation) throw new Error("flag animation was not created");
        animation.pause();
        animation.currentTime = 0;
        await new Promise(requestAnimationFrame);
        const firstPole = [
          screenPoint(cloth, 0, 10),
          screenPoint(cloth, 0, 78)
        ];
        const firstFly = [
          screenPoint(cloth, 132, 10),
          screenPoint(cloth, 132, 78)
        ];
        animation.currentTime = 2799;
        await new Promise(requestAnimationFrame);
        const secondPole = [
          screenPoint(cloth, 0, 10),
          screenPoint(cloth, 0, 78)
        ];
        const secondFly = [
          screenPoint(cloth, 132, 10),
          screenPoint(cloth, 132, 78)
        ];
        const poleMovement = Math.max(
          ...firstPole.map((point, index) => distance(point, secondPole[index]))
        );
        const flyMovement = Math.max(
          ...firstFly.map((point, index) => distance(point, secondFly[index]))
        );
        document.body.dataset.flagDimensions = "132x88";
        document.body.dataset.flagHoistWidth = "33";
        document.body.dataset.flagTransformOrigin = computedOrigin;
        document.body.dataset.flagPoleMovement = poleMovement.toFixed(3);
        document.body.dataset.flagFlyMovement = flyMovement.toFixed(3);
        return poleMovement <= .1 && flyMovement >= 4;
      } finally {
        probe.remove();
      }
    }

    function campusThresholdsRender() {
      const root = document.createElement("main");
      root.innerHTML = `
        <span id="raised-display"></span>
        <span id="goal-display"></span>
        <span id="percent-display"></span>
        <span id="meter-fill"></span>
        <span id="over-goal-message"></span>
        <svg id="school-scene" xmlns="http://www.w3.org/2000/svg"
             viewBox="0 0 1600 900"></svg>
      `;
      const view = createFundraiserView(
        root,
        createScene({ maxStudents: 24 }),
        { locale: "en-US", currency: "USD" }
      );
      const update = (ratio, reducedMotion = false) => view.update({
        raised: ratio * 100000,
        goal: 100000,
        ...deriveProgress(ratio * 100000, 100000),
        reducedMotion,
        celebrationActive: false
      });

      update(.9999);
      if (
        root.dataset.goalAchieved !== "false"
        || root.querySelector(".goal-flag").getAttribute("opacity") !== "0"
      ) return false;

      update(1);
      if (
        root.dataset.goalAchieved !== "true"
        || root.querySelector(".goal-flag").getAttribute("opacity") !== "1"
        || root.querySelector("#over-goal-message").hidden
      ) return false;

      update(1.065);
      if (root.dataset.swingPercent !== "50.000") return false;
      update(1.135);
      if (
        root.dataset.teacherPercent !== "50.000"
        || root.dataset.visibleTeachers !== "1.000000"
      ) return false;
      update(1.30);
      if (
        root.dataset.busPercent !== "50.000"
        || root.querySelector(".school-bus").getAttribute("transform")
          !== "translate(-75.00 3.13)"
      ) return false;
      update(1.30, true);
      if (
        root.querySelector(".school-bus").getAttribute("transform")
          !== "translate(0 0)"
      ) return false;
      update(1.35);
      return root.dataset.studentPercent === "100.000"
        && root.dataset.swingPercent === "100.000"
        && root.dataset.teacherPercent === "100.000"
        && root.dataset.busPercent === "100.000"
        && root.querySelector("#percent-display").textContent
          === "135% — campus ready!";
    }

    async function suppliedLogoLoads() {
      const image = new Image();
      const loaded = new Promise((resolve, reject) => {
        image.addEventListener("load", resolve, { once: true });
        image.addEventListener("error", reject, { once: true });
      });
      image.src = "../Logo.png";
      await loaded;
      return image.naturalWidth === 430 && image.naturalHeight === 332;
    }

    async function completedFacadeHasNoSkyLeaks() {
      const root = document.createElement("main");
      root.innerHTML = `
        <span id="raised-display"></span>
        <span id="goal-display"></span>
        <span id="percent-display"></span>
        <span id="meter-fill"></span>
        <span id="over-goal-message"></span>
        <svg id="school-scene" xmlns="http://www.w3.org/2000/svg"
             viewBox="0 0 1600 900"></svg>
      `;
      const view = createFundraiserView(
        root,
        createScene({ maxStudents: 0 }),
        { locale: "en-US", currency: "USD" }
      );
      view.update({
        raised: 100000,
        goal: 100000,
        ...deriveProgress(100000, 100000),
        reducedMotion: true,
        celebrationActive: false
      });

      const source = new XMLSerializer().serializeToString(
        root.querySelector("#school-scene")
      );
      const image = new Image();
      const loaded = new Promise((resolve, reject) => {
        image.addEventListener("load", resolve, { once: true });
        image.addEventListener("error", reject, { once: true });
      });
      image.src = `data:image/svg+xml;charset=utf-8,${encodeURIComponent(source)}`;
      await loaded;

      const canvas = document.createElement("canvas");
      canvas.width = 1600;
      canvas.height = 900;
      const context = canvas.getContext("2d", { willReadFrequently: true });
      context.drawImage(image, 0, 0);
      const windowXs = [569, 677, 785, 1109, 1217, 1325];
      const samples = windowXs.flatMap((x) => [
        [x - 9, 575, "lower odd-row left fringe"],
        [x + 71, 595, "lower even-row right fringe"],
        [x - 9, 485, "upper odd-row left fringe"],
        [x + 71, 465, "upper even-row right fringe"]
      ]);
      samples.push(
        [1012, 510, "entrance arch shoulder"],
        [1012, 530, "entrance lower stagger fringe"],
        [913, 355, "tower arch shoulder"]
      );

      for (const [x, y, name] of samples) {
        const [red, green, blue, alpha] = context.getImageData(x, y, 1, 1).data;
        if (alpha !== 255 || red <= green || red <= blue) {
          throw new Error(`${name} at ${x},${y} rendered rgba(${red},${green},${blue},${alpha})`);
        }
      }
      return true;
    }

    const checks = [
      ["100% completes school with no students", () => {
        const value = deriveProgress(100000, 100000);
        return value.buildingRatio === 1 && value.studentRatio === 0;
      }],
      ["125% fills students", () => deriveProgress(125000, 100000).studentRatio === 1],
      ["Campus ramps honor 103/110/117/125/130/135 thresholds", () => {
        const at103 = deriveProgress(103000, 100000);
        const at110 = deriveProgress(110000, 100000);
        const at117 = deriveProgress(117000, 100000);
        const at125 = deriveProgress(125000, 100000);
        const at130 = deriveProgress(130000, 100000);
        const at135 = deriveProgress(135000, 100000);
        return at103.goalAchieved
          && at103.swingRatio === 0
          && at110.swingRatio === 1
          && at110.teacherRatio === 0
          && at117.teacherRatio === 1
          && at117.busRatio === 0
          && at125.playgroundRatio === 1
          && at125.busRatio === 0
          && at130.busRatio === .5
          && at135.busRatio === 1;
      }],
      ["Campus renderer reaches exact visual endpoints", campusThresholdsRender],
      ["Supplied TCF logo loads at its intrinsic dimensions", suppliedLogoLoads],
      ["Reveal sum is exact", () => Math.abs(revealSum(.375, 200) - 75) < 1e-10],
      ["Fractional operator amounts satisfy native constraints", () => {
        const values = deriveOperatorControlValues(123.75, 12345);
        const raised = document.createElement("input");
        raised.type = "number";
        raised.min = "0";
        raised.step = "any";
        raised.value = values.raised;
        const goal = document.createElement("input");
        goal.type = "number";
        goal.min = "5e-324";
        goal.step = "any";
        goal.value = values.goal;
        const slider = document.createElement("input");
        slider.type = "range";
        slider.min = "0";
        slider.max = values.sliderMax;
        slider.step = "any";
        slider.value = values.sliderValue;
        const expectedSliderValue = Number(values.sliderValue);
        const sliderTolerance = 16 * Number.EPSILON * Math.max(
          1,
          Math.abs(expectedSliderValue),
          Math.abs(slider.valueAsNumber)
        );
        return raised.checkValidity()
          && goal.checkValidity()
          && slider.checkValidity()
          && raised.valueAsNumber === 123.75
          && goal.valueAsNumber === 12345
          && Math.abs(slider.valueAsNumber - expectedSliderValue) <= sliderTolerance;
      }],
      ["Native slider endpoint submits the exact canonical amount", () => {
        const goals = [MIN_GOAL, MAX_GOAL, 0.5, 12345, 240429705269.63782];
        return goals.every((goalValue) => {
          const form = document.createElement("form");
          const raised = document.createElement("input");
          raised.type = "number";
          raised.step = "any";
          const slider = document.createElement("input");
          slider.type = "range";
          slider.min = "0";
          slider.max = deriveOperatorControlValues(0, goalValue).sliderMax;
          slider.step = "any";
          form.append(raised, slider);

          let committedRaised = null;
          slider.addEventListener("input", () => {
            raised.value = String(
              deriveRaisedFromSliderValue(slider.valueAsNumber, goalValue)
            );
          });
          form.addEventListener("submit", (event) => {
            event.preventDefault();
            committedRaised = Number(raised.value);
          });

          slider.value = slider.max;
          slider.dispatchEvent(new Event("input"));
          form.dispatchEvent(new Event("submit", { cancelable: true }));
          const endpoint = deriveSliderMaximum(goalValue);
          const rawValue = slider.valueAsNumber;
          const endpointTolerance = Number.EPSILON * Math.abs(endpoint) * 8;
          return rawValue <= endpoint
            && endpoint - rawValue <= endpointTolerance
            && committedRaised === endpoint
            && deriveProgress(committedRaised, goalValue).studentRatio === 1;
        });
      }],
      ["Positive fractional goals satisfy native constraints", () => {
        const goal = document.createElement("input");
        goal.type = "number";
        goal.min = "5e-324";
        goal.step = "any";
        goal.value = "0.5";
        return goal.checkValidity() && goal.valueAsNumber === 0.5;
      }],
      ["Renderer meter preserves partial CSSOM state in full and reduced motion", () => {
        const root = document.createElement("main");
        root.innerHTML = `
          <span id="raised-display"></span>
          <span id="goal-display"></span>
          <span id="percent-display"></span>
          <span id="meter-fill"></span>
          <span id="over-goal-message"></span>
          <svg id="school-scene"></svg>
        `;
        const view = createFundraiserView(
          root,
          createScene({ maxStudents: 0 }),
          { locale: "en-US", currency: "USD" }
        );
        const meter = root.querySelector("#meter-fill");
        const goalValue = MAX_GOAL;
        const raisedValue = goalValue - 1;
        const progress = deriveProgress(raisedValue, goalValue);

        for (const reducedMotion of [false, true]) {
          view.update({
            raised: raisedValue,
            goal: goalValue,
            ...progress,
            reducedMotion,
            celebrationActive: false
          });
          if (
            meter.style.width !== "var(--meter-width)"
            || meter.style.getPropertyValue("--meter-width")
              !== "99.99999999999999%"
          ) {
            return false;
          }
        }

        view.update({
          raised: goalValue,
          goal: goalValue,
          ...deriveProgress(goalValue, goalValue),
          reducedMotion: false,
          celebrationActive: false
        });
        return meter.style.width === "100%"
          && meter.style.getPropertyValue("--meter-width") === "";
      }],
      ["Scene remains within limits", () => {
        const scene = createScene({ maxStudents: 24 });
        return scene.blocks.length === 308
          && scene.students.length === 36
          && scene.teachers.length === 2
          && Object.isFrozen(scene.campus);
      }],
      ["Student routes clear each other across the full ramp", studentRoutesClearAcrossFullRamp],
      ["Bus bounds clear students across the full ramp", busBoundsClearStudentsAcrossFullRamp],
      ["Painted student masks remain pixel-disjoint", paintedStudentMasksNeverIntersect],
      ["Painted bus remains pixel-disjoint from students through 135%", paintedBusNeverIntersectsStudentsThroughBusPhase],
      ["Only the prominent tree uses the shortened 76-unit trunk", prominentTreeTrunkGeometryIsScoped],
      ["Painted masks use the deliberately offset SVG viewport origin", paintedMasksUseSvgViewportOrigin],
      ["Painted bus clears the tree, teacher, playground, school, and stage edges", paintedBusClearsCampusObstaclesAndStageEdges],
      ["Pakistan flag is exact and its wave stays pole-anchored", flagGeometryAndWaveArePoleAnchored],
      ["Completed facade has masonry pixels at former stagger leaks", completedFacadeHasNoSkyLeaks],
      ["Actual bus DOM clears overlays and painted keyboard descendants by 12px at responsive sizes", busClearsOverlaysAcrossViewports]
    ];

    const requestedCheck = new URLSearchParams(location.search).get("check");
    const selectedChecks = requestedCheck === "bus-overlays"
      ? checks.filter(([name]) => name.startsWith("Actual bus DOM"))
      : requestedCheck === "bus"
        ? checks.filter(([name]) =>
          name.startsWith("Bus bounds")
          || name.startsWith("Painted bus")
          || name.startsWith("Only the prominent tree")
          || name.startsWith("Painted masks use")
          || name.startsWith("Actual bus DOM")
        )
      : checks;
    let failures = 0;
    for (const [name, check] of selectedChecks) {
      const item = document.createElement("li");
      try {
        const passed = await check();
        item.textContent = `${passed ? "PASS" : "FAIL"} — ${name}`;
        item.className = passed ? "pass" : "fail";
        if (!passed) failures += 1;
      } catch (error) {
        item.textContent = `FAIL — ${name}: ${error.message}`;
        item.className = "fail";
        failures += 1;
      }
      results.append(item);
    }
    document.title = failures ? `FAIL (${failures}) — TCF Harness` : "PASS — TCF Harness";
    document.body.dataset.failures = String(failures);
    document.body.dataset.viewport = `${innerWidth}x${innerHeight}`;
    document.querySelector('script[type="module"]')?.remove();
  </script>
