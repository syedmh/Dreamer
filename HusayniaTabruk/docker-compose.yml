name: tabruk

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: tabruk
      POSTGRES_USER: tabruk
      POSTGRES_PASSWORD: tabruk_local_development
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tabruk -d tabruk"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - tabruk-postgres:/var/lib/postgresql/data

volumes:
  tabruk-postgres:
