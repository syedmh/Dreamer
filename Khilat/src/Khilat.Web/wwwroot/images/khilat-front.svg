<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600">
  <defs>
    <style>
      .body { fill: #F7E7CE; stroke: #8B7D6B; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
      .detail { fill: none; stroke: #8B7D6B; stroke-width: 0.8; stroke-linecap: round; opacity: 0.4; }
      .stitch { fill: none; stroke: #8B7D6B; stroke-width: 0.6; stroke-dasharray: 3 2; opacity: 0.45; }
      .btn { fill: none; stroke: #8B7D6B; stroke-width: 1.2; opacity: 0.7; }
      .btn-hole { fill: none; stroke: #8B7D6B; stroke-width: 0.6; opacity: 0.5; }
      .placket { fill: none; stroke: #8B7D6B; stroke-width: 0.6; opacity: 0.3; }
      .shadow { fill: #8B7D6B; opacity: 0.08; stroke: none; }
      .texture { fill: none; stroke: #8B7D6B; stroke-width: 0.3; opacity: 0.06; }
    </style>
    <pattern id="fabric" x="0" y="0" width="8" height="8" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="8" y2="8" class="texture"/>
      <line x1="4" y1="0" x2="8" y2="4" class="texture"/>
      <line x1="0" y1="4" x2="4" y2="8" class="texture"/>
    </pattern>
    <filter id="shadow-filter" x="-5%" y="-5%" width="115%" height="115%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4" result="blur"/>
      <feOffset in="blur" dx="2" dy="3" result="offsetBlur"/>
      <feFlood flood-color="#000000" flood-opacity="0.12" result="color"/>
      <feComposite in="color" in2="offsetBlur" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g filter="url(#shadow-filter)">
    <!-- Left Sleeve -->
    <path class="body" d="M 128 105 L 32 198 L 65 232 L 135 175 Z"/>
    <!-- Right Sleeve -->
    <path class="body" d="M 272 105 L 368 198 L 335 232 L 265 175 Z"/>
    <!-- Left Cuff -->
    <path class="body" d="M 32 198 L 28 212 L 61 246 L 65 232 Z"/>
    <!-- Right Cuff -->
    <path class="body" d="M 368 198 L 372 212 L 339 246 L 335 232 Z"/>
    <!-- Main Body -->
    <path class="body" d="
      M 172 95 Q 150 99 128 105 L 135 175
      Q 131 255 126 318 Q 118 428 100 540
      Q 150 522 200 508 Q 250 522 300 540
      Q 282 428 274 318 Q 269 255 265 175
      L 272 105 Q 250 99 228 95 L 200 135 Z"/>
    <!-- Left Collar Stand -->
    <path class="body" d="M 156 98 L 160 68 L 176 65 L 172 95 Z"/>
    <!-- Right Collar Stand -->
    <path class="body" d="M 244 98 L 240 68 L 224 65 L 228 95 Z"/>
  </g>

  <!-- Fabric texture overlay on body -->
  <path d="M 172 95 Q 150 99 128 105 L 135 175
    Q 131 255 126 318 Q 118 428 100 540
    Q 150 522 200 508 Q 250 522 300 540
    Q 282 428 274 318 Q 269 255 265 175
    L 272 105 Q 250 99 228 95 L 200 135 Z" fill="url(#fabric)" stroke="none"/>
  <path d="M 128 105 L 32 198 L 65 232 L 135 175 Z" fill="url(#fabric)" stroke="none"/>
  <path d="M 272 105 L 368 198 L 335 232 L 265 175 Z" fill="url(#fabric)" stroke="none"/>

  <!-- Subtle fold shadows -->
  <path class="shadow" d="M 200 135 Q 170 300 165 508 L 200 508 Z"/>
  <path class="shadow" d="M 135 175 Q 140 280 145 400 L 135 400 Z"/>
  <path class="shadow" d="M 265 175 Q 260 280 255 400 L 265 400 Z"/>

  <!-- Shoulder seam stitch lines -->
  <line x1="172" y1="95" x2="128" y2="105" class="stitch"/>
  <line x1="228" y1="95" x2="272" y2="105" class="stitch"/>
  <!-- Side seam stitch -->
  <path class="stitch" d="M 135 175 Q 131 255 126 318 Q 118 428 100 540"/>
  <path class="stitch" d="M 265 175 Q 269 255 274 318 Q 282 428 300 540"/>
  <!-- Sleeve underarm stitch -->
  <line x1="135" y1="175" x2="65" y2="232" class="stitch"/>
  <line x1="265" y1="175" x2="335" y2="232" class="stitch"/>
  <!-- Hem stitch -->
  <path class="stitch" d="M 100 537 Q 150 519 200 505 Q 250 519 300 537"/>
  <!-- Cuff stitch lines -->
  <line x1="30" y1="205" x2="63" y2="239" class="stitch"/>
  <line x1="32" y1="198" x2="65" y2="232" class="stitch"/>
  <line x1="370" y1="205" x2="337" y2="239" class="stitch"/>
  <line x1="368" y1="198" x2="335" y2="232" class="stitch"/>
  <!-- Collar stitch lines -->
  <path class="stitch" d="M 158 70 L 174 67"/>
  <path class="stitch" d="M 240 70 L 226 67"/>
  <path class="stitch" d="M 157 96 L 173 93"/>
  <path class="stitch" d="M 243 96 L 227 93"/>

  <!-- V-Neck opening lines -->
  <line x1="172" y1="95" x2="200" y2="135" class="detail" style="opacity:0.6"/>
  <line x1="228" y1="95" x2="200" y2="135" class="detail" style="opacity:0.6"/>

  <!-- Button Placket -->
  <line x1="196" y1="135" x2="196" y2="508" class="placket"/>
  <line x1="204" y1="135" x2="204" y2="508" class="placket"/>

  <!-- Waist dart stitch lines -->
  <path class="stitch" d="M 160 180 Q 155 280 155 370"/>
  <path class="stitch" d="M 240 180 Q 245 280 245 370"/>

  <!-- Buttons with button holes -->
  <circle cx="200" cy="158" r="4.5" class="btn"/>
  <line x1="197" y1="158" x2="203" y2="158" class="btn-hole"/>
  <circle cx="200" cy="218" r="4.5" class="btn"/>
  <line x1="197" y1="218" x2="203" y2="218" class="btn-hole"/>
  <circle cx="200" cy="278" r="4.5" class="btn"/>
  <line x1="197" y1="278" x2="203" y2="278" class="btn-hole"/>
  <circle cx="200" cy="338" r="4.5" class="btn"/>
  <line x1="197" y1="338" x2="203" y2="338" class="btn-hole"/>
  <circle cx="200" cy="398" r="4.5" class="btn"/>
  <line x1="197" y1="398" x2="203" y2="398" class="btn-hole"/>
  <circle cx="200" cy="455" r="4.5" class="btn"/>
  <line x1="197" y1="455" x2="203" y2="455" class="btn-hole"/>
</svg>
