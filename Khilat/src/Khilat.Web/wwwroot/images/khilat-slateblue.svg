<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600">
  <defs>
    <style>
      .body { fill: #6A5ACD; stroke: #3E348B; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
      .detail { fill: none; stroke: #3E348B; stroke-width: 0.8; stroke-linecap: round; opacity: 0.4; }
      .btn { fill: none; stroke: #3E348B; stroke-width: 1; opacity: 0.7; }
      .placket { fill: none; stroke: #3E348B; stroke-width: 0.6; opacity: 0.3; }
    </style>
  </defs>

  <!-- Left Sleeve -->
  <path class="body" d="M 128 105 L 32 198 L 65 232 L 135 175 Z"/>
  <!-- Right Sleeve -->
  <path class="body" d="M 272 105 L 368 198 L 335 232 L 265 175 Z"/>

  <!-- Left Cuff -->
  <path class="body" d="M 32 198 L 28 212 L 61 246 L 65 232 Z"/>
  <!-- Right Cuff -->
  <path class="body" d="M 368 198 L 372 212 L 339 246 L 335 232 Z"/>

  <!-- Cuff stitch lines -->
  <line x1="30" y1="205" x2="63" y2="239" class="detail"/>
  <line x1="370" y1="205" x2="337" y2="239" class="detail"/>

  <!-- Main Body -->
  <path class="body" d="
    M 172 95
    Q 150 99 128 105
    L 135 175
    Q 131 255 126 318
    Q 118 428 100 540
    Q 150 522 200 508
    Q 250 522 300 540
    Q 282 428 274 318
    Q 269 255 265 175
    L 272 105
    Q 250 99 228 95
    L 200 135
    Z"/>

  <!-- Left Collar Stand -->
  <path class="body" d="M 156 98 L 160 68 L 176 65 L 172 95 Z"/>
  <!-- Right Collar Stand -->
  <path class="body" d="M 244 98 L 240 68 L 224 65 L 228 95 Z"/>

  <!-- V-Neck opening lines -->
  <line x1="172" y1="95" x2="200" y2="135" class="detail" style="opacity:0.6"/>
  <line x1="228" y1="95" x2="200" y2="135" class="detail" style="opacity:0.6"/>

  <!-- Button Placket edges -->
  <line x1="196" y1="135" x2="196" y2="508" class="placket"/>
  <line x1="204" y1="135" x2="204" y2="508" class="placket"/>

  <!-- Buttons -->
  <circle cx="200" cy="158" r="4" class="btn"/>
  <circle cx="200" cy="218" r="4" class="btn"/>
  <circle cx="200" cy="278" r="4" class="btn"/>
  <circle cx="200" cy="338" r="4" class="btn"/>
  <circle cx="200" cy="398" r="4" class="btn"/>
  <circle cx="200" cy="455" r="4" class="btn"/>

  <!-- Waist dart hints -->
  <path class="detail" d="M 160 180 Q 155 280 155 370"/>
  <path class="detail" d="M 240 180 Q 245 280 245 370"/>
</svg>
