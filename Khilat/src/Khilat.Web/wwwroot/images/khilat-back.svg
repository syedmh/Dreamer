<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600">
  <defs>
    <style>
      .body { fill: #F7E7CE; stroke: #8B7D6B; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
      .detail { fill: none; stroke: #8B7D6B; stroke-width: 0.8; stroke-linecap: round; opacity: 0.4; }
      .stitch { fill: none; stroke: #8B7D6B; stroke-width: 0.6; stroke-dasharray: 3 2; opacity: 0.4; }
    </style>
  </defs>

  <!-- Left Sleeve -->
  <path class="body" d="M 128 105 L 32 198 L 65 232 L 135 175 Z"/>
  <!-- Right Sleeve -->
  <path class="body" d="M 272 105 L 368 198 L 335 232 L 265 175 Z"/>
  <!-- Left Cuff -->
  <path class="body" d="M 32 198 L 28 212 L 61 246 L 65 232 Z"/>
  <!-- Right Cuff -->
  <path class="body" d="M 368 198 L 372 212 L 339 246 L 335 232 Z"/>
  <!-- Cuff stitch lines -->
  <line x1="30" y1="205" x2="63" y2="239" class="detail"/>
  <line x1="370" y1="205" x2="337" y2="239" class="detail"/>

  <!-- Main Body - back view with round neckline and longer center hem -->
  <path class="body" d="
    M 172 90
    Q 150 95 128 105
    L 135 175
    Q 131 255 126 318
    Q 118 428 100 540
    Q 150 555 200 562
    Q 250 555 300 540
    Q 282 428 274 318
    Q 269 255 265 175
    L 272 105
    Q 250 95 228 90
    Q 200 100 172 90
    Z"/>

  <!-- Back Collar Band -->
  <path class="body" d="
    M 155 92
    Q 155 72 170 68
    Q 200 62 230 68
    Q 245 72 245 92
    Q 228 88 200 94
    Q 172 88 155 92
    Z"/>

  <!-- Center back seam -->
  <line x1="200" y1="94" x2="200" y2="562" class="detail" style="opacity:0.25"/>
  <!-- Back yoke line -->
  <path class="stitch" d="M 135 175 Q 200 195 265 175"/>
  <!-- Side seam stitch -->
  <path class="stitch" d="M 135 175 Q 131 255 126 318 Q 118 428 100 540"/>
  <path class="stitch" d="M 265 175 Q 269 255 274 318 Q 282 428 300 540"/>
  <!-- Hem stitch -->
  <path class="stitch" d="M 100 537 Q 150 552 200 559 Q 250 552 300 537"/>
  <!-- Shoulder seam stitch -->
  <line x1="172" y1="90" x2="128" y2="105" class="stitch"/>
  <line x1="228" y1="90" x2="272" y2="105" class="stitch"/>
  <!-- Back waist darts -->
  <path class="stitch" d="M 160 180 Q 158 280 162 370"/>
  <path class="stitch" d="M 240 180 Q 242 280 238 370"/>
</svg>
