<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600">
  <defs>
    <style>
      .body { fill: #F7E7CE; stroke: #8B7D6B; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .detail { fill: none; stroke: #8B7D6B; stroke-width: 1.2; stroke-linecap: round; opacity: 0.5; }
      .stitch { fill: none; stroke: #8B7D6B; stroke-width: 0.8; stroke-dasharray: 4 3; opacity: 0.5; }
      .btn { fill: none; stroke: #8B7D6B; stroke-width: 1.5; opacity: 0.8; }
      .btn-hole { fill: none; stroke: #8B7D6B; stroke-width: 1; opacity: 0.6; }
      .btn-thread { fill: none; stroke: #8B7D6B; stroke-width: 0.6; opacity: 0.5; }
      .placket { fill: none; stroke: #8B7D6B; stroke-width: 1; opacity: 0.35; }
      .fabric { fill: none; stroke: #8B7D6B; stroke-width: 0.3; opacity: 0.08; }
    </style>
    <pattern id="weave" x="0" y="0" width="6" height="6" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="6" y2="6" class="fabric"/>
      <line x1="3" y1="0" x2="6" y2="3" class="fabric"/>
      <line x1="0" y1="3" x2="3" y2="6" class="fabric"/>
    </pattern>
  </defs>

  <!-- Close-up of collar and button area, scaled up -->
  <!-- Body fabric visible portion -->
  <path class="body" d="
    M 80 600
    L 100 165
    Q 140 145 155 120
    L 200 260
    L 245 120
    Q 260 145 300 165
    L 320 600
    Z"/>

  <!-- Fabric texture overlay -->
  <path d="
    M 80 600 L 100 165 Q 140 145 155 120
    L 200 260 L 245 120 Q 260 145 300 165
    L 320 600 Z" fill="url(#weave)" stroke="none"/>

  <!-- Left Collar Stand -->
  <path class="body" d="M 112 155 L 120 48 L 170 35 L 155 120 Z"/>
  <!-- Right Collar Stand -->
  <path class="body" d="M 288 155 L 280 48 L 230 35 L 245 120 Z"/>

  <!-- Collar stitch lines -->
  <path class="stitch" d="M 115 100 L 163 78"/>
  <path class="stitch" d="M 285 100 L 237 78"/>
  <path class="stitch" d="M 118 140 L 158 115"/>
  <path class="stitch" d="M 282 140 L 242 115"/>
  <path class="stitch" d="M 122 50 L 168 37"/>
  <path class="stitch" d="M 278 50 L 232 37"/>

  <!-- V-Neck opening lines -->
  <line x1="155" y1="120" x2="200" y2="260" class="detail"/>
  <line x1="245" y1="120" x2="200" y2="260" class="detail"/>

  <!-- Button Placket -->
  <line x1="192" y1="260" x2="192" y2="600" class="placket"/>
  <line x1="208" y1="260" x2="208" y2="600" class="placket"/>
  <!-- Placket fold stitch lines -->
  <line x1="185" y1="260" x2="185" y2="600" class="stitch"/>
  <line x1="215" y1="260" x2="215" y2="600" class="stitch"/>

  <!-- Button 1 -->
  <circle cx="200" cy="310" r="12" class="btn"/>
  <line x1="194" y1="310" x2="206" y2="310" class="btn-hole"/>
  <line x1="200" y1="304" x2="200" y2="316" class="btn-hole"/>
  <circle cx="196" cy="307" r="1.5" class="btn-thread"/>
  <circle cx="204" cy="307" r="1.5" class="btn-thread"/>
  <circle cx="196" cy="313" r="1.5" class="btn-thread"/>
  <circle cx="204" cy="313" r="1.5" class="btn-thread"/>

  <!-- Button 2 -->
  <circle cx="200" cy="430" r="12" class="btn"/>
  <line x1="194" y1="430" x2="206" y2="430" class="btn-hole"/>
  <line x1="200" y1="424" x2="200" y2="436" class="btn-hole"/>
  <circle cx="196" cy="427" r="1.5" class="btn-thread"/>
  <circle cx="204" cy="427" r="1.5" class="btn-thread"/>
  <circle cx="196" cy="433" r="1.5" class="btn-thread"/>
  <circle cx="204" cy="433" r="1.5" class="btn-thread"/>

  <!-- Button 3 -->
  <circle cx="200" cy="545" r="12" class="btn"/>
  <line x1="194" y1="545" x2="206" y2="545" class="btn-hole"/>
  <line x1="200" y1="539" x2="200" y2="551" class="btn-hole"/>
  <circle cx="196" cy="542" r="1.5" class="btn-thread"/>
  <circle cx="204" cy="542" r="1.5" class="btn-thread"/>
  <circle cx="196" cy="548" r="1.5" class="btn-thread"/>
  <circle cx="204" cy="548" r="1.5" class="btn-thread"/>
</svg>
